name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5

    - name: Install Dependencies
      run: sudo apt install opencl-headers ocl-icd-opencl-dev build-essential

    - name: Build
      run: CGO_ENABLED=1 go build

    - name: Zip
      run: zip -r sleipnir-linux.zip sleipnir gpu/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sleipnir-linux
        path: sleipnir-linux.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5

    - name: Install Dependencies
      run: sudo apt install opencl-headers ocl-icd-opencl-dev build-essential zip

    - name: Install Zig
      uses: mlugg/setup-zig@v1

    - name: Build
      run: |
        CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
        CC="zig cc -target x86_64-windows" \
        CXX="zig c++ -target x86_64-windows" \
        go build

    - name: Zip
      run: zip -r sleipnir-windows.zip sleipnir.exe gpu/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sleipnir-windows
        path: sleipnir-windows.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          sleipnir-linux/sleipnir-linux.zip
          sleipnir-windows/sleipnir-windows.zip
