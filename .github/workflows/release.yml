name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install
      uses: actions/setup-go@v5

    - name: Install Dependencies
      run: sudo apt install opencl-headers ocl-icd-opencl-dev build-essential

    - name: Set env
      run: go env -w CGO_ENABLED=1

    - name: Build
      run: go build

    - name: Zip
      run: zip -r sleipnir-linux.zip sleipnir gpu/

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: sleipnir-linux.zip
